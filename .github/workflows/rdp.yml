name: Free Windows RDP (6h session)

on:
  workflow_dispatch:

concurrency:
  group: pcfree-rdp-chain
  cancel-in-progress: true

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 3

          $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
          $local = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -InformationLevel Quiet -WarningAction SilentlyContinue
          "RDP_LISTENER=$(if ($listener) { 'LISTEN' } else { 'NOT_LISTENING' })" >> $env:GITHUB_ENV
          "RDP_LOCAL_TEST=$local" >> $env:GITHUB_ENV
          Write-Host "RDP listener: $(if ($listener) { 'LISTEN' } else { 'NOT_LISTENING' }), local test: $local"

          $pass = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $pass -AccountNeverExpires -PasswordNeverExpires
          } else {
            Set-LocalUser -Name "RDP" -Password $pass
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          Write-Host "RDP user ready (password from secret, not printed)"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.104.7-amd64.msi"
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/norestart" -Wait
          Remove-Item $msi -Force -ErrorAction SilentlyContinue

      - name: Connect Tailscale
        shell: pwsh
        run: |
          $ts = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $ts up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="pcfree-$env:GITHUB_RUN_ID"
          $ip = $null
          for ($i = 0; $i -lt 12 -and -not $ip; $i++) {
            Start-Sleep -Seconds 5
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
          }
          if (-not $ip) { Write-Error "Tailscale IP not assigned"; exit 1 }
          Write-Host "TAILSCALE_IP=$ip"
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          (& $ts status 2>$null | Out-String) | Set-Content "$env:GITHUB_WORKSPACE\ts-status.txt"

      - name: Setup phone storage and persistent data
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $phoneIp = "${{ secrets.PHONE_IP }}"
          $ws = $env:GITHUB_WORKSPACE
          if (-not $phoneIp) { "PHONE_STORAGE=NO_PHONE_IP" >> $env:GITHUB_ENV; exit 0 }
          $phoneTcp = Test-NetConnection -ComputerName $phoneIp -Port 2222 -InformationLevel Quiet -WarningAction SilentlyContinue
          "PHONE_SFTP_TCP=$phoneTcp" >> $env:GITHUB_ENV

          $base = "C:\ProgramData\pcfree"
          New-Item -ItemType Directory -Force -Path "$base\apps" | Out-Null
          choco install winfsp -y --no-progress | Out-Null
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "$env:TEMP\rclone.zip"
          Expand-Archive -Path "$env:TEMP\rclone.zip" -DestinationPath "$env:TEMP\rclone" -Force
          Copy-Item (Get-ChildItem "$env:TEMP\rclone" -Recurse -Filter rclone.exe | Select-Object -First 1).FullName "$base\rclone.exe" -Force
          $rclone = "$base\rclone.exe"
          $cfg = "$base\rclone.conf"
          & $rclone --config $cfg config create phone sftp host $phoneIp port 2222 user phone pass phone skip_key_file true 2>&1 | Out-File "$ws\rclone.log" -Append

          $env:TAILSCALE_IP | Set-Content "$ws\RDP-IP.txt" -Encoding ascii
          "RDP=$env:TAILSCALE_IP`:3389`nUser=RDP" | Set-Content "$ws\RDP-CONNECT.txt" -Encoding ascii
          & $rclone --config $cfg copyto "$ws\RDP-IP.txt" "phone:/PC-Free/RDP-IP.txt" --quiet 2>&1 | Out-File "$ws\rclone.log" -Append
          & $rclone --config $cfg copyto "$ws\RDP-CONNECT.txt" "phone:/PC-Free/RDP-CONNECT.txt" --quiet 2>&1 | Out-File "$ws\rclone.log" -Append
          $check = (& $rclone --config $cfg cat "phone:/PC-Free/RDP-IP.txt" 2>$null).Trim()
          "Z_DRIVE=$(if ($check -eq $env:TAILSCALE_IP) { 'READY' } else { 'FAILED' })" >> $env:GITHUB_ENV
          "Z_VERIFY=$(if ($check -eq $env:TAILSCALE_IP) { 'OK' } else { 'FAIL' })" >> $env:GITHUB_ENV

          $userDir = "C:\Users\RDP"
          foreach ($d in @("Desktop", "Documents", "Downloads")) {
            New-Item -ItemType Directory -Force -Path "$userDir\$d" | Out-Null
            & $rclone --config $cfg copy "phone:/PC-Free/WIN-BACKUP/$d" "$userDir\$d" --quiet 2>&1 | Out-File "$ws\rclone.log" -Append
          }
          & $rclone --config $cfg copy "phone:/PC-Free/WIN-BACKUP/Roaming" "$userDir\AppData\Roaming" --quiet 2>&1 | Out-File "$ws\rclone.log" -Append
          "DATA_RESTORE=DONE" >> $env:GITHUB_ENV

          & $rclone --config $cfg copy "phone:/PC-Free/INSTALL-APPS.cmd" "$base\apps" --quiet 2>&1 | Out-File "$ws\rclone.log" -Append
          & $rclone --config $cfg copy "phone:/PC-Free/Installers" "$base\apps\Installers" --quiet 2>&1 | Out-File "$ws\rclone.log" -Append

          $mountArgs = @("--config", $cfg, "mount", "phone:/", "Z:", "--vfs-cache-mode", "full", "--links", "--retries", "5")
          $mount = Start-Process -FilePath $rclone -ArgumentList $mountArgs -WindowStyle Hidden -PassThru -RedirectStandardError "$ws\rclone-mount-err.log"
          for ($i = 0; $i -lt 15 -and -not (Test-Path "Z:\PC-Free"); $i++) { Start-Sleep -Seconds 2 }
          "Z_MOUNT=$(if (Test-Path 'Z:\PC-Free') { 'OK' } else { 'FAIL' })" >> $env:GITHUB_ENV

          $localApps = "$userDir\Apps"
          New-Item -ItemType Directory -Force -Path $localApps | Out-Null
          $appDefs = @(
            @{ Name = "Sublime"; Local = "$localApps\Sublime"; Remote = "Z:\PC-Free\Apps\Sublime"; Installer = "$base\apps\Installers\sublime_text_build_4215_x64_setup.exe"; Args = @("/VERYSILENT", "/NORESTART", "/DIR=$localApps\Sublime"); ExeName = "sublime_text.exe" },
            @{ Name = "Tally"; Local = "$localApps\Tally"; Remote = "Z:\PC-Free\Apps\Tally"; Installer = ""; Args = @(); ExeName = "tally.exe" }
          )
          foreach ($app in $appDefs) {
            $hasRemote = (Test-Path $app.Remote) -and ((Get-ChildItem $app.Remote -File -Recurse -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0)
            if ($hasRemote) {
              & $rclone --config $cfg copy "phone:/PC-Free/Apps/$($app.Name)" $app.Local --quiet 2>&1 | Out-File "$ws\rclone.log" -Append
              "RESTORE_$($app.Name.ToUpper())=OK" >> $env:GITHUB_ENV
            } elseif ($app.Installer -and (Test-Path $app.Installer)) {
              $p = Start-Process -FilePath $app.Installer -ArgumentList $app.Args -PassThru -WindowStyle Hidden -RedirectStandardOutput "$base\apps\$($app.Name).out.log" -RedirectStandardError "$base\apps\$($app.Name).err.log"
              if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; $code = "TIMEOUT" } else { $code = $p.ExitCode }
              "$($app.Name.ToUpper())_EXIT=$code" >> $env:GITHUB_ENV
            }
          }
          "APP_INSTALL=DONE" >> $env:GITHUB_ENV

          $shell = New-Object -ComObject WScript.Shell
          foreach ($app in $appDefs) {
            $exe = Get-ChildItem $app.Local -Filter $app.ExeName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) {
              $lnk = $shell.CreateShortcut("$userDir\Desktop\$($app.Name).lnk")
              $lnk.TargetPath = $exe.FullName
              $lnk.WorkingDirectory = $exe.DirectoryName
              $lnk.Save()
              "SHORTCUT_$($app.Name.ToUpper())=OK" >> $env:GITHUB_ENV
            } else {
              "SHORTCUT_$($app.Name.ToUpper())=NO_EXE" >> $env:GITHUB_ENV
            }
          }
          $sc = "$localApps\Sublime"
          $tc = "$localApps\Tally"
          "APP_SUBLIME_DIR=$(if ((Test-Path $sc) -and ((Get-ChildItem $sc -File -Recurse -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0)) { 'OK' } else { 'MISSING' })" >> $env:GITHUB_ENV
          "APP_TALLY_DIR=$(if ((Test-Path $tc) -and ((Get-ChildItem $tc -File -Recurse -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0)) { 'OK' } else { 'MISSING' })" >> $env:GITHUB_ENV

          $roots = @("C:\Program Files", "C:\Program Files (x86)", "C:\Users\RDP\AppData\Local", "C:\Users\RDP\AppData\Roaming", "C:\")
          $matched = @()
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $matched += Get-ChildItem -Directory -Path $root -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'Tally|Sublime' } | ForEach-Object { $_.FullName }
            }
          }
          "MATCHED_DIRS=$($matched -join ' | ')" >> $env:GITHUB_ENV
          $allLog = ""
          foreach ($f in (Get-ChildItem "$base\apps\*.log" -ErrorAction SilentlyContinue)) {
            & $rclone --config $cfg copyto "$($f.FullName)" "phone:/PC-Free/Apps/$($f.Name)" --quiet 2>&1 | Out-File "$ws\rclone.log" -Append
            $allLog += "--- $($f.Name) ---`n" + (Get-Content $f.FullName -Raw) + "`n"
          }
          if ($allLog.Length -gt 1200) { $allLog = $allLog.Substring($allLog.Length - 1200) }
          $allLog = ($allLog -replace '\r?\n', ' ')
          "INSTALL_LOG=$allLog" >> $env:GITHUB_ENV

          $bkScript = @'
          $rclone = "C:\ProgramData\pcfree\rclone.exe"
          $cfg = "C:\ProgramData\pcfree\rclone.conf"
          $userDir = "C:\Users\RDP"
          foreach ($d in @("Desktop", "Documents", "Downloads")) {
            if (Test-Path "$userDir\$d") { & $rclone --config $cfg copy "$userDir\$d" "phone:/PC-Free/WIN-BACKUP/$d" --quiet }
          }
          if (Test-Path "$userDir\AppData\Roaming") { & $rclone --config $cfg copy "$userDir\AppData\Roaming" "phone:/PC-Free/WIN-BACKUP/Roaming" --quiet }
          '@
          $bkScript | Set-Content "$base\backup.ps1"
          schtasks /create /tn "PCFreeBackup" /tr "pwsh.exe -NoProfile -ExecutionPolicy Bypass -File C:\ProgramData\pcfree\backup.ps1" /sc minute /mo 10 /ru SYSTEM /rl HIGHEST /f | Out-Null
          "DATA_SYNC=TASK" >> $env:GITHUB_ENV

          $startup = "$userDir\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\pcfree-z.cmd"
          @"
          @echo off
          start "" /B "C:\ProgramData\pcfree\rclone.exe" --config "C:\ProgramData\pcfree\rclone.conf" mount phone:/ Z: --vfs-cache-mode full --links --retries 5
          "@ | Set-Content $startup
          Write-Host "Phone storage ready"

      - name: Publish status to repo branch
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $phoneIp = "${{ secrets.PHONE_IP }}"
          $rcloneErr = ""
          if (Test-Path "$ws\rclone.log") { $rcloneErr = (Get-Content "$ws\rclone.log" -Raw) }
          if (Test-Path "$ws\rclone-mount-err.log") { $rcloneErr += (Get-Content "$ws\rclone-mount-err.log" -Raw) }
          if ($phoneIp) { $rcloneErr = $rcloneErr.Replace($phoneIp, "<PHONE_IP>") }
          if ($rcloneErr.Length -gt 1500) { $rcloneErr = $rcloneErr.Substring($rcloneErr.Length - 1500) }
          $tsStatus = ""
          if (Test-Path "$ws\ts-status.txt") { $tsStatus = (Get-Content "$ws\ts-status.txt" -Raw) }
          if ($tsStatus.Length -gt 1500) { $tsStatus = $tsStatus.Substring(0, 1500) }

          $lines = @(
            "TIME=$(Get-Date -Format o)",
            "RUN_ID=$env:GITHUB_RUN_ID",
            "TAILSCALE_IP=$env:TAILSCALE_IP",
            "RDP_LISTENER=$env:RDP_LISTENER",
            "RDP_LOCAL_TEST=$env:RDP_LOCAL_TEST",
            "PHONE_SFTP_TCP=$env:PHONE_SFTP_TCP",
            "Z_DRIVE=$env:Z_DRIVE",
            "Z_VERIFY=$env:Z_VERIFY",
            "Z_MOUNT=$env:Z_MOUNT",
            "DATA_RESTORE=$env:DATA_RESTORE",
            "APP_INSTALL=$env:APP_INSTALL",
            "APP_SUBLIME_DIR=$env:APP_SUBLIME_DIR",
            "APP_TALLY_DIR=$env:APP_TALLY_DIR",
            "RESTORE_SUBLIME=$env:RESTORE_SUBLIME",
            "RESTORE_TALLY=$env:RESTORE_TALLY",
            "SHORTCUT_SUBLIME=$env:SHORTCUT_SUBLIME",
            "SHORTCUT_TALLY=$env:SHORTCUT_TALLY",
            "SUBLIME_EXIT=$env:SUBLIME_EXIT",
            "DIRECTX_EXIT=$env:DIRECTX_EXIT",
            "TALLY_EXIT=$env:TALLY_EXIT",
            "TALLY_NSIS_EXIT=$env:TALLY_NSIS_EXIT",
            "MATCHED_DIRS=$env:MATCHED_DIRS",
            "INSTALL_LOG=$env:INSTALL_LOG",
            "DATA_SYNC=$env:DATA_SYNC",
            "----- RCLONE ERR -----",
            $rcloneErr,
            "----- TAILSCALE STATUS -----",
            $tsStatus
          )
          $lines | Set-Content "$ws\STATUS.txt"

          git config user.name "Jarvis"
          git config user.email "jarvis@local"
          git checkout -B status
          git add STATUS.txt
          git commit -m "status run $env:GITHUB_RUN_ID" 2>$null
          git push -f origin status
          Write-Host "STATUS.txt published to branch 'status'"

      - name: Show connection details
        shell: pwsh
        run: |
          Write-Host "==================================="
          Write-Host "RDP address : $env:TAILSCALE_IP`:3389"
          Write-Host "Username    : RDP"
          Write-Host "Password    : (secret RDP_PASSWORD)"
          Write-Host "==================================="
          Write-Host "Session ends in 350 minutes."

      - name: Keep alive then chain next session
        shell: pwsh
        run: |
          for ($i = 1; $i -le 66; $i++) {
            Write-Host "[$(Get-Date -Format o)] RDP active - cycle $i"
            Start-Sleep -Seconds 300
          }
          Write-Host "Final data backup..."
          if (Test-Path "C:\ProgramData\pcfree\backup.ps1") {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File "C:\ProgramData\pcfree\backup.ps1"
          }
          $rclone = "C:\ProgramData\pcfree\rclone.exe"
          $cfg = "C:\ProgramData\pcfree\rclone.conf"
          foreach ($app in @("Sublime", "Tally")) {
            $src = "C:\Users\RDP\Apps\$app"
            if (Test-Path $src) { & $rclone --config $cfg copy $src "phone:/PC-Free/Apps/$app" --quiet }
          }
          Write-Host "Final app backup done"
          Write-Host "Triggering next session..."
          $uri = "https://api.github.com/repos/saxenauma493-wq/pcfree-rdp/actions/workflows/rdp.yml/dispatches"
          $hdr = @{
            Authorization = "Bearer ${{ secrets.GH_PAT }}"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-RestMethod -Method Post -Uri $uri -Headers $hdr -Body '{"ref":"main"}' -ContentType "application/json"
          Write-Host "Next session dispatched"
